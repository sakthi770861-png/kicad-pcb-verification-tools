name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Synthetic evidence regression
        run: |
          python examples/make_synthetic_regression.py /tmp/pcbverify-demo
          python -m pcbverify regression-check /tmp/pcbverify-demo/regression-manifest.json

      - name: Compile and install CLI package
        run: |
          python -m compileall -q pcbverify
          python -m pip install --no-deps .
          pcbverify --help

      - name: Release gate remains closed without native evidence
        run: |
          set +e
          python -m pcbverify release-gate --json /tmp/pcbverify-release-gate.json
          code=$?
          set -e
          test "$code" -eq 1
          python -c 'import json; r=json.load(open("/tmp/pcbverify-release-gate.json")); assert r["status"] == "BLOCKED"'